name: Publish opfsql to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11: trusted publishing (OIDC, no token) needs npm
      # 11.5.1 or later; npm 10 signs the provenance but publishes anonymously,
      # which the registry answers with 404.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use npm 11.5.1 or later
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        working-directory: opfsql-lib
        run: npm ci

      - name: Run tests
        working-directory: opfsql-lib
        run: npm test

      - name: Build
        working-directory: opfsql-lib
        run: npm run build

      - name: Verify tag matches package.json version
        working-directory: opfsql-lib
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
        if: github.event_name == 'push'

      - name: Publish to npm
        working-directory: opfsql-lib
        run: npm publish --provenance --access public
